# NewsInteractAction Package Descriptor
# This file defines the action's package metadata, dependencies, and configuration

package:
  # Action name in namespace/action_name format
  name: jvagent/news_interact_action

  # Package author
  author: jvagent

  # Archetype: The main Action class name (same as the Action Node class)
  archetype: NewsInteractAction

  # Package version
  version: 0.0.1

  # Package metadata
  meta:
    title: NewsInteractAction
    description: InteractAction that retrieves the news from various sources and creates a summary for the user
    group: jvagent
    type: interact_action

  # Package configuration
  config:
    order:
      weight: -50

  # Package dependencies
  dependencies:
    # jvagent version requirement
    jvagent: ~0.0.1
    pip:
      - feedparser>=6.0.11
      - beautifulsoup4>=4.13.4
    # Other action dependencies (by namespace/action_name)
    actions: []
